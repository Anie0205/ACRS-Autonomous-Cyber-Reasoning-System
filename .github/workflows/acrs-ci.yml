name: ACRS Security Sandbox

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      # Future expansion: Add a step here to run pytest against generated patches
      - name: Run Backend Tests
        run: echo "Sandbox ready for Pytest integration."
